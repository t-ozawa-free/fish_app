<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}魚おすすめアプリ{% endblock %}</title>
    <!-- Bootstrap5をCDNから読み込む -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- サイドバー：ダッシュボード／魚種一覧／グラフへのメニューを表示する -->
        <nav class="bg-dark text-white p-3 flex-shrink-0" style="width: 250px; min-height: 100vh;">
            <h5 class="mb-4">魚おすすめアプリ</h5>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item mb-1">
                    <a class="nav-link text-white" href="{% url 'fish_web:dashboard' %}">ダッシュボード</a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link text-white" href="{% url 'fish_web:fish_list' %}">魚種一覧</a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link text-white" href="{% url 'fish_web:graph' %}">グラフ</a>
                </li>
            </ul>
        </nav>
        <!-- 各画面の中身を表示するメイン領域 -->
        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
